name: PPSSPP Vita Configure Test

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08

    steps:
      - name: Descargar PPSSPP
        uses: actions/checkout@v4
        with:
          repository: hrydgard/ppsspp
          path: PPSSPP
          submodules: recursive

      - name: Comprobar herramientas
        run: |
          cmake --version
          arm-vita-eabi-gcc --version

      - name: Intentar configurar
        run: |
          cmake -S PPSSPP -B build \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
