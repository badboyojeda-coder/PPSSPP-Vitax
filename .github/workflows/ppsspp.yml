name: Descargar PPSSPP

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4
        with:
          repository: hrydgard/ppsspp
          path: PPSSPP
          submodules: recursive

      - name: Comprobar descarga
        run: |
          ls -la PPSSPP
          test -f PPSSPP/CMakeLists.txt
          echo "Código fuente de PPSSPP descargado correctamente"
